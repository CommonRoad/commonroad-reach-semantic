planning:
  dt: 0.1
  steps_computation: 20
  coordinate_system: "CVLN"
  reference_point: "REAR"

reachable_set:
  mode_computation: 8
  size_grid: 0.25
  size_grid_2nd: 0.1
  radius_terminal_split: 0.7
  prune_nodes_not_reaching_final_step: 0

vehicle:
  ego:
    # velocity in m/s
    v_lon_min: 0.0
    v_lon_max: 30.0
    v_lat_min: -4.0
    v_lat_max: 4.0
    # absolute max velocity
    v_max: 30.0

    # acceleration in m/s^2
    a_lon_min: -10.0
    a_lon_max: 10.0
    a_lat_min: -2.0
    a_lat_max: 2.0
    # maximum engine power
    a_max: 10.0

traffic_rules:
  safe_distance: true
  activated_rules:
    - NoBackwardDrivingRule
#    - NoOppositeDrivingRule
#    - LineMarkingRule
#    - TrafficLightRule
#    - LTL G(F InFrontOf_V7)
#    - LTL G(((InLanelet_2) | X(InLanelet_2)) -> X(X(G(InLanelet_1))))
    - LTL G[15..20](!InLanelet_47240)
    - LTL G SafeDistance_V202
#    - LTL G(!InLanelet_4)
#     - LTL G[0..2](!InLanelet_2)
#    - LTL F[10..15](InLanelet_4)
    #- LTL G[4..10](InLanelet_2)
    #- TPL SafeFollowingDistanceTo_V202
