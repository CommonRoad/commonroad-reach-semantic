debug:
  # visualization settings
  # draw the planning problem
  draw_planning_problem: True
  # visualize dynamic obstacles with icons
  draw_icons: True
  plot_limits: [0, 55, -25, 25]

planning:
  dt: 0.2
  steps_computation: 15
  coordinate_system: "CVLN"

reachable_set:
  mode_computation: 8
  size_grid: 0.25
  size_grid_2nd: 0.1
  radius_terminal_split: 0.7

vehicle:
  ego:
    # velocity in m/s
    v_lon_min: 0.0
    v_lon_max: 20.0
    v_lat_min: -4.0
    v_lat_max: 4.0
    # absolute max velocity
    v_max: 30.0

    # acceleration in m/s^2
    a_lon_min: -15
    a_lon_max: 15
    a_lat_min: -2.0
    a_lat_max: 2.0
    # maximum engine power
    a_max: 15.0

traffic_rules:
  activated_rules:
    # rules to be concretized
    - NoBackwardDrivingRule
    - NoOppositeDrivingRule
    - LineMarkingRule
    - TrafficLightRule
#    - PriorityRule
#    - EnteringVehiclesRule
#    - LTL G((F(InStraightSuc) & F(V38_InStraightSuc) & (No_straight_straight_PriorityOver_V38 | Same_straight_straight_PriorityAs_V38)) -> (!InIntersection | ((CausesBrakingFor_V38 | F[0..5]InConflictBy_V38) -> !InConflictWith_V38)))
#    # simulate no opposite driving in LTL
#    - LTL ! F (InLanelet_8 | InLanelet_13 | InLanelet_15)
#    - LTL G[10..30](BehindStopLine)
