debug:
  # visualization settings
  # draw the planning problem
  draw_planning_problem: True
  # visualize dynamic obstacles with icons
  draw_icons: True

planning:
  dt: 0.2
  steps_computation: 15
  coordinate_system: "CVLN"

reachable_set:
  mode_computation: 8
  size_grid: 0.25
  size_grid_2nd: 0.1
  radius_terminal_split: 0.7
  prune_nodes_not_reaching_final_step: true

traffic_rules:
  activated_rules:
    # rules to be concretized
#    - NoBackwardDrivingRule
    - NoOppositeDrivingRule
    - EnteringVehiclesRule
    # R-IN4
    - "LTL G (
        (F InStraightSuc & F V38_InStraightSuc & No_straight_straight_PriorityOver_V38)
        -> G (!InIntersection | G (
          (InConflictWith_V38 -> (!CausesBrakingFor_V38 & !F[0..5]InConflictBy_V38))
          & (InConflictBy_V38 -> !F[0..2] InConflictWith_V38)
        ))
      )"
    # simulate no opposite driving in LTL
    - LTL ! F (InLanelet_8 | InLanelet_13 | InLanelet_15)
