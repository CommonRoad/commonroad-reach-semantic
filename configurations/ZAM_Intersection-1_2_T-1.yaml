debug:
  # visualization settings
  # draw the planning problem
  draw_planning_problem: True
  # visualize dynamic obstacles with icons
  draw_icons: True

planning:
  dt: 0.2
  steps_computation: 15
  coordinate_system: "CVLN"
  reference_point: CENTER
#  reference_point: REAR  # used for figures in Edmond's paper

reachable_set:
  mode_computation: 8
#  mode_repartition: 3
  size_grid: 0.251
  size_grid_2nd: 0.1
  radius_terminal_split: 0.7
  prune_nodes_not_reaching_final_step: true

vehicle:
  ego:
    length: 4.5
    width: 1.8
    a_lat_max: 2.0
    a_lat_min: -2.0
    a_lon_max: 6.0
    a_lon_min: -6.0
    v_lat_max: 4.0
    v_lat_min: -4.0
    v_lon_max: 20.0
    v_lon_min: 0.0
    v_max: 30.0
  other:
    length: 4.5
    width: 1.8

traffic_rules:
  activated_rules:
    # rules to be concretized
#    - NoBackwardDrivingRule
    - NoOppositeDrivingRule
#    - LineMarkingRule
#    - TrafficLightRule
    #    - PriorityRule
#    - RightBeforeLeftRule
    #    - LeftTurningRule
#    - LTL G((Intersection_LeftOf_V38 & !HasRelevantTrafficLight & (F(InStraightSuc) & F(V38_InStraightSuc) & Same_straight_straight_PriorityAs_V38)) -> (!InIntersection | ((F[0..10]InConflictBy_V38 -> !InConflictWith_V38))))
    # R-IN3
#    - LTL G((true & !false & (F(InStraightSuc) & F(V38_InStraightSuc) & Same_straight_straight_PriorityAs_V38)) -> (!InIntersection | (((CausesBrakingFor_V38 | F[0..10]InConflictBy_V38) -> !InConflictWith_V38))))
    - LTL G((true & !false & (F(InStraightSuc) & F(V38_InStraightSuc) & Same_straight_straight_PriorityAs_V38)) -> G(!InIntersection | ((InConflictWith_V38 -> (!CausesBrakingFor_V38 & !F[0..5]InConflictBy_V38)) & (InConflictBy_V38 -> !F[0..2] InConflictWith_V38))))
#    - LTL G((true & !false & (F(InStraightSuc) & F(V31_InStraightSuc) & Same_straight_straight_PriorityAs_V31)) -> G(!InIntersection | ((InConflictWith_V31 -> (!CausesBrakingFor_V31 & !F[0..10]InConflictBy_V31)) & (InConflictBy_V31 -> !F[0..10] InConflictWith_V31))))
    # simulate no opposite driving in LTL
    - LTL ! F (InLanelet_8 | InLanelet_13 | InLanelet_15)