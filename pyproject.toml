[project]
name = "commonroad-reach-semantic"
version = "0.1.0"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10,<3.11"
#license = { file = "LICENSE.txt" }
authors = [
    { name = "Cyber-Physical Systems Group, Technical University of Munich", email = "commonroad@lists.lrz.de" }
]
description = "A Toolbox for Computing Specification-Compliant Reachable Sets of Automated Vehicles"
keywords = [
    "autonomous vehicles",
    "automated driving",
    "motion planning",
    "reachability analysis",
    "specifications",
    "temporal logic",
]
dependencies = [
    "commonroad-drivability-checker>=2023.1",
    "commonroad-io>=2023.2",
#    "commonroad-reach>=2023.1.1",
    "commonroad-route-planner~=2022.3",
    "cython>=0.29.28",
    "matplotlib>=3.3.3",
    "more-itertools>=9.1.0",
    "networkx>=2.6.3",
    "numpy>=1.19.2",
    "omegaconf>=2.1.1",
    "pyvis==0.3.1",
    "seaborn>=0.10.0",
    "shapely>=2.0.0",
]

classifiers = [
    "Programming Language :: C++",
    "Programming Language :: Python :: 3.10",
    "Operating System :: POSIX :: Linux",
]

#[project.urls]
#Homepage = "https://commonroad.in.tum.de/tools/commonroad-reach"
#Documentation = "https://commonroad.in.tum.de/docs/commonroad-reach/"
#Forum = "https://commonroad.in.tum.de/forum/c/commonroad-reach/19"
#Source = "https://gitlab.lrz.de/tum-cps/commonroad-reach"

[project.optional-dependencies]
test = [
    "pytest>=6.2.2",
]
#docs = [
#    "Sphinx>=4.5.0",
#    "sphinx-autodoc-typehints>=1.18.1",
#    "m2r2>=0.3.0",
#]
build = [
    "scikit-build-core~=0.8.0",
    "pybind11~=2.11.1",
    "pathspec>=0.12.1",
    "pyproject-metadata>=0.7.1",
    "cmake>=3.24",
]

[build-system]
requires = [
    "scikit-build-core~=0.8.0",
    "pybind11~=2.11.1",
]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
wheel.packages = ["commonroad_reach_semantic"]
build-dir = "build/{build_type}_{wheel_tag}"
install.components = ["pycrreachsem"]

minimum-version = "0.8"
cmake.version = ">=3.24"

[tool.scikit-build.cmake.define]
ADD_TESTS = "OFF"
