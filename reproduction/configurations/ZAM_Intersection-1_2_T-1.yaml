debug:
  draw_planning_problem: True
  draw_icons: True

planning:
  dt: 0.2
  steps_computation: 15
  coordinate_system: "CVLN"
  reference_point: CENTER

reachable_set:
  size_grid: 0.251
  size_grid_2nd: 0.1
  radius_terminal_split: 0.7
  prune_nodes_not_reaching_final_step: true

traffic_rules:
  activated_rules:
    - NoOppositeDrivingRule
    # R-IN3
    - LTL G((true & !false & (F(InStraightSuc) & F(V38_InStraightSuc) & Same_straight_straight_PriorityAs_V38)) -> G(!InIntersection | ((InConflictWith_V38 -> (!CausesBrakingFor_V38 & !F[0..5]InConflictBy_V38)) & (InConflictBy_V38 -> !F[0..2] InConflictWith_V38))))
    # simulate no opposite driving in LTL
    - LTL ! F (InLanelet_8 | InLanelet_13 | InLanelet_15)