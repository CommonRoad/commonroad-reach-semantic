# Authors: Florian Lercher, Gerald Würsching, Tobias Mascetta. Cyber-Physical Systems Group, TUM


# --------------- Gitlab Internal Variables ------------------------
# Predefined internal variables from gitlab ci: see https://docs.gitlab.com/ee/ci/variables/predefined_variables.html
# CI_REGISTRY: Gitlab Container Registry with Docker container for project
# CI_JOB_TOKEN: Token, valid as long as the job is running
# CI_PROJECT_DIR: path where project is cloned to and gitlab job runs from

stages:
  - static-check
  - compile
  - test

default:
  image: $CI_REGISTRY/cps/commonroad/commonroad-reach-semantic/deps:ci-fc

variables:
  BUILD_JOBS: 20

before_script:
  - git config --global url."https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.lrz.de/".insteadOf "git@gitlab.lrz.de:"

.conda-init: &conda-init
  - conda init bash
  - source ~/.bashrc

.python-prepare: &python-prepare
  - python -m pip install --upgrade pip
  - pip install -r ./requirements.txt
  - conda install -c conda-forge spot

.python-versions: &python-versions
  - "3.10"

pycodestyle-commit:
  stage: static-check
  script:
    - pip install pycodestyle
    - git diff ${CI_COMMIT_BEFORE_SHA}...${CI_COMMIT_SHA} -- '*.py' | pycodestyle --max-line-length=120 --diff
  except:
    - merge_requests
  allow_failure: true

pycodestyle-merge-request:
  stage: static-check
  script:
    - pip install pycodestyle
    - git diff ${CI_MERGE_REQUEST_TARGET_BRANCH_SHA}...${CI_MERGE_REQUEST_SOURCE_BRANCH_SHA} -- '*.py' | pycodestyle --max-line-length=120 --diff
  only:
    - merge_requests
  allow_failure: true

clang-format:
  stage: static-check
  script: ./ci/clang-format.sh
  needs: [ ]

clang-tidy:
  stage: static-check
  script:
    - mkdir build && cd build
    - cmake -DCMAKE_BUILD_TYPE=Debug -DCMAKE_EXPORT_COMPILE_COMMANDS=ON ..
    - cd ..
    - ./ci/clang-tidy.sh
  needs: [ ]


### build C++ library using CMake directly ###
compile-cpp:
  stage: compile
  script:
    - *conda-init
    - conda activate "$CONDA_ENV_PREFIX$PYTHON_VER"
    - *python-prepare
    - mkdir build-debug && cd build-debug
    - cmake -DCMAKE_BUILD_TYPE=Debug -DADD_TESTS=true ..
    - cmake --build . -- -j $BUILD_JOBS
  parallel:
    matrix:
      - PYTHON_VER: *python-versions
  artifacts:
    paths:
      - commonroad_reach_semantic/pycrreachs.*.so
      - build-debug/cpp/doctest_runner
    expire_in: 30 minutes
  needs: [ ]

### build and install C++ extension using pip ###
compile-via-pip-install:
  stage: compile
  script:
    - *conda-init
    - conda activate "$CONDA_ENV_PREFIX$PYTHON_VER"
    - *python-prepare
    - pip install -v . --config-settings=cmake.define.CMAKE_BUILD_PARALLEL_LEVEL=$BUILD_JOBS
  parallel:
    matrix:
      - PYTHON_VER: *python-versions
  needs: [ ]

### test Python ###
test-python:
  stage: test
  script:
    - *conda-init
    - conda activate "$CONDA_ENV_PREFIX$PYTHON_VER"
    - *python-prepare
    - cd tests
    - pytest .
  parallel:
    matrix:
      - PYTHON_VER: *python-versions
  needs:
    - job: compile-cpp
      artifacts: true

### test C++ ###
test-cpp:
  stage: test
  script:
    - cd build-debug
    - ./cpp/doctest_runner
  parallel:
    matrix:
      - PYTHON_VER: *python-versions
  needs:
    - job: compile-cpp
      artifacts: true
